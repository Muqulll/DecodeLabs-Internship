<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details - Decode Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      .markdown-body h1, .markdown-body h2, .markdown-body h3 {
        font-weight: 700;
        margin-top: 0.75rem;
        margin-bottom: 0.5rem;
      }
      .dark .markdown-body h1, .dark .markdown-body h2, .dark .markdown-body h3 {
        color: #f8fafc;
      }
      .markdown-body h1, .markdown-body h2, .markdown-body h3 {
        color: #0f172a;
      }
      .markdown-body ul { list-style-type: disc; padding-left: 1.25rem; margin-top: 0.5rem; }
      .markdown-body ol { list-style-type: decimal; padding-left: 1.25rem; margin-top: 0.5rem; }
      .markdown-body p { margin-bottom: 0.5rem; }
    </style>
  </head>
  <body class="bg-[#f3f4f6] dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen font-sans antialiased transition-colors duration-200">
    <div class="max-w-4xl mx-auto px-6 py-10">
      
      <!-- Top Navigation & Theme Toggle -->
      <div class="flex justify-between items-center mb-6">
        <a href="/" class="inline-flex items-center text-sm font-medium text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-colors">
          ← Back to Catalog
        </a>
        <button
          id="themeToggleBtn"
          type="button"
          class="p-2 px-3 rounded-xl bg-white dark:bg-slate-800 text-slate-700 dark:text-amber-400 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors text-xs flex items-center gap-2 border border-slate-200 dark:border-slate-700 shadow-sm"
        >
          <span id="themeToggleIcon">🌙</span>
          <span class="font-medium"> Change Theme</span>
        </button>
      </div>

      <!-- Detail Showcase Card -->
      <div id="productDetail" class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm p-8 transition-colors">
        <p class="text-slate-400 text-sm">Loading product details...</p>
      </div>

      <!-- Edit Modal Form -->
      <div id="editSection" class="hidden mt-6 bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-md space-y-4 transition-colors">
        <h2 class="text-base font-bold text-slate-900 dark:text-white">Edit Product</h2>
        <form id="editForm" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Product Name</label>
              <input type="text" id="editName" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Price ($)</label>
              <input type="number" id="editPrice" min="1" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Image URL</label>
            <input type="url" id="editImage" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Description (Markdown Supported)</label>
            <textarea id="editDescription" rows="5" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 font-mono"></textarea>
          </div>
          <div class="flex gap-3 justify-end pt-2">
            <button type="button" onclick="toggleEdit(false)" class="px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 text-xs font-medium rounded-xl transition-all">
              Cancel
            </button>
            <button type="submit" class="px-4 py-2 bg-[#0b3c3d] hover:bg-[#072a2b] dark:bg-teal-600 dark:hover:bg-teal-500 text-white text-xs font-medium rounded-xl transition-all">
              Save Changes
            </button>
          </div>
        </form>
      </div>

    </div>

    <script>
      // Theme Toggle Logic
      const themeToggleBtn = document.getElementById('themeToggleBtn');
      const themeToggleIcon = document.getElementById('themeToggleIcon');

      function applyTheme(isDark) {
        if (isDark) {
          document.documentElement.classList.add('dark');
          themeToggleIcon.textContent = '☀️';
          localStorage.setItem('theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          themeToggleIcon.textContent = '🌙';
          localStorage.setItem('theme', 'light');
        }
      }

      const savedTheme = localStorage.getItem('theme');
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(savedTheme === 'dark' || (!savedTheme && systemPrefersDark));

      themeToggleBtn.addEventListener('click', () => {
        const isCurrentlyDark = document.documentElement.classList.contains('dark');
        applyTheme(!isCurrentlyDark);
      });

      // Product Logic
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');

      const productDetail = document.getElementById('productDetail');
      const editSection = document.getElementById('editSection');
      const editForm = document.getElementById('editForm');

      let currentProduct = null;

      async function loadProduct() {
        if (!productId) {
          productDetail.innerHTML = '<p class="text-red-500">No product ID provided.</p>';
          return;
        }

        try {
          const res = await fetch(`/products/${productId}`);
          if (!res.ok) throw new Error("Product not found");

          currentProduct = await res.json();
          const parsedMarkdown = marked.parse(currentProduct.description || "");

          productDetail.innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
              <div class="bg-slate-100 dark:bg-slate-900 rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-700/50 aspect-square">
                <img src="${currentProduct.image || 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600&q=80'}" alt="${currentProduct.name}" class="w-full h-full object-cover" />
              </div>

              <div class="space-y-6">
                <div>
                  <span class="text-xs font-mono bg-slate-100 dark:bg-slate-700 px-2.5 py-1 rounded-full text-slate-500 dark:text-slate-300 border border-slate-200 dark:border-slate-600">ID: #${currentProduct.id}</span>
                  <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white mt-3">${currentProduct.name}</h1>
                  <p class="text-3xl font-bold text-emerald-600 dark:text-emerald-400 mt-2">$${currentProduct.price}</p>
                </div>

                <div>
                  <h3 class="text-xs uppercase font-semibold text-slate-400 dark:text-slate-500 tracking-wider mb-2">Details</h3>
                  <div class="markdown-body text-slate-600 dark:text-slate-300 text-sm leading-relaxed">
                    ${parsedMarkdown}
                  </div>
                </div>

                <div class="pt-6 border-t border-slate-100 dark:border-slate-700/50 flex gap-3">
                  <button onclick="toggleEdit(true)" class="bg-slate-900 hover:bg-slate-800 dark:bg-teal-600 dark:hover:bg-teal-500 text-white text-xs font-medium px-5 py-2.5 rounded-xl transition-all shadow-sm">
                    Edit Details
                  </button>
                  <button onclick="deleteProduct(${currentProduct.id})" class="bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 hover:bg-red-100 dark:hover:bg-red-900/50 border border-red-200 dark:border-red-800 text-xs font-medium px-5 py-2.5 rounded-xl transition-all">
                    Delete Product
                  </button>
                </div>
              </div>
            </div>
          `;
        } catch (err) {
          productDetail.innerHTML = `<p class="text-red-500">Product #${productId} does not exist.</p>`;
        }
      }

      function toggleEdit(show) {
        if (show && currentProduct) {
          document.getElementById('editName').value = currentProduct.name;
          document.getElementById('editPrice').value = currentProduct.price;
          document.getElementById('editImage').value = currentProduct.image || "";
          document.getElementById('editDescription').value = currentProduct.description;
          editSection.classList.remove('hidden');
        } else {
          editSection.classList.add('hidden');
        }
      }

      editForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const updatedData = {
          name: document.getElementById('editName').value,
          price: document.getElementById('editPrice').value,
          image: document.getElementById('editImage').value,
          description: document.getElementById('editDescription').value
        };

        try {
          const res = await fetch(`/products/${productId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updatedData)
          });

          if (res.ok) {
            toggleEdit(false);
            loadProduct();
          } else {
            alert('Failed to update product.');
          }
        } catch (err) {
          alert('Network error.');
        }
      });

      async function deleteProduct(id) {
        if (!confirm("Are you sure you want to delete this product?")) return;

        try {
          const res = await fetch(`/products/${id}`, { method: 'DELETE' });
          if (res.ok) {
            window.location.href = '/';
          } else {
            alert("Failed to delete product.");
          }
        } catch (err) {
          alert("Network error.");
        }
      }

      loadProduct();
    </script>
  </body>
</html>
