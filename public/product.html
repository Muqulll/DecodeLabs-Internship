<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details - Decode Labs</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-violet-900 text-slate-100 min-h-screen font-sans">
    <div class="max-w-2xl mx-auto px-6 py-12">
      <!-- Back Button -->
      <a href="/" class="text-slate-400 hover:text-white text-sm mb-6 inline-block transition-colors">
        ← Back to Catalog
      </a>

      <!-- Detail Card container -->
      <div id="productDetail" class="bg-slate-800/50 p-8 rounded-xl border border-slate-700 space-y-6">
        <p class="text-slate-400 text-sm">Loading product details...</p>
      </div>
    </div>

    <script>
      // 1. Get the URL query parameter (e.g., ?id=2)
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');

      const productDetail = document.getElementById('productDetail');

      // 2. Fetch specific product using GET /products/:id
      async function loadProduct() {
        if (!productId) {
          productDetail.innerHTML = '<p class="text-red-400">No product ID provided.</p>';
          return;
        }

        try {
          const res = await fetch(`/products/${productId}`);
          if (!res.ok) throw new Error("Product not found");

          const product = await res.json();

          // Render details + Delete action
          productDetail.innerHTML = `
            <div class="flex justify-between items-start">
              <div>
                <span class="text-xs text-slate-500 font-mono">ID: #${product.id}</span>
                <h1 class="text-2xl font-bold text-white mt-1">${product.name}</h1>
              </div>
              <span class="text-2xl font-bold text-emerald-400">$${product.price}</span>
            </div>

            <div>
              <h3 class="text-xs uppercase font-semibold text-slate-400 tracking-wider mb-2">Description</h3>
              <p class="text-slate-300 text-sm leading-relaxed">${product.description}</p>
            </div>

            <div class="pt-6 border-t border-slate-700/50 flex justify-end gap-4">
              <button onclick="deleteProduct(${product.id})" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white border border-red-500/30 text-xs font-medium px-4 py-2 rounded-lg transition-all">
                Delete Product
              </button>
            </div>
          `;
        } catch (err) {
          productDetail.innerHTML = `<p class="text-red-400">Product #${productId} does not exist.</p>`;
        }
      }

      // 3. Delete Handler
      async function deleteProduct(id) {
        if (!confirm("Are you sure you want to delete this product?")) return;

        try {
          const res = await fetch(`/products/${id}`, { method: 'DELETE' });
          if (res.ok) {
            window.location.href = '/'; // Redirect back to homepage
          } else {
            alert("Failed to delete product.");
          }
        } catch (err) {
          alert("Network error.");
        }
      }

      loadProduct();
    </script>
  </body>
</html>
