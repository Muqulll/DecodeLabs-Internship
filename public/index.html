<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Catalog - Clean Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body class="bg-[#f3f4f6] dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen font-sans antialiased transition-colors duration-200">

    <!-- Top Dark Teal Header Banner -->
    <header class="bg-[#0b3c3d] dark:bg-slate-950 text-white shadow-md transition-colors duration-200">
      <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-emerald-500/20 flex items-center justify-center text-emerald-400 font-bold">D</div>
          <div>
            <h1 class="text-xl font-semibold tracking-tight text-white">Decode Store</h1>
            <p class="text-xs text-teal-200/70">Modern Product Management</p>
          </div>
        </div>

        <!-- Search Bar -->
        <div class="relative w-full md:w-80">
          <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
            class="w-full bg-[#082e2f] dark:bg-slate-900 text-sm text-white placeholder-teal-300/50 dark:placeholder-slate-500 rounded-full px-4 py-2 pl-10 focus:outline-none focus:ring-2 focus:ring-teal-400/50 border border-teal-800 dark:border-slate-800"
          />
          <svg class="w-4 h-4 absolute left-3.5 top-2.5 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>

        <div class="flex items-center gap-3">
          <!-- Dark Mode Toggle Button -->
          <button
            id="themeToggleBtn"
            type="button"
            class="p-2 rounded-xl bg-[#082e2f] dark:bg-slate-800 text-teal-200 dark:text-amber-400 hover:bg-teal-900/50 dark:hover:bg-slate-700 transition-colors text-xs flex items-center gap-2 border border-teal-800 dark:border-slate-700"
          >
            <span id="themeToggleIcon">🌙</span>
            <span class="hidden sm:inline font-medium">Theme</span>
          </button>

          <span class="px-3 py-1 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-xs rounded-full font-mono">
            API Active
          </span>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-6 py-8">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Sidebar Filters & Add Product Form -->
        <aside class="lg:col-span-4 space-y-6">
          <!-- Product Entry Form -->
          <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200/80 dark:border-slate-700/80 shadow-sm transition-colors">
            <h2 class="text-base font-bold text-slate-900 dark:text-white mb-4">Add Product</h2>
            <form id="productForm" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Product Name</label>
                <input type="text" id="name" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500" placeholder="e.g. Ergonomic Chair" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Image URL</label>
                <input type="url" id="image" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500" placeholder="https://..." />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Price ($)</label>
                <input type="number" id="price" required min="1" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500" placeholder="49" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-1">Description (Markdown Supported)</label>
                <textarea id="description" required rows="3" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 font-mono" placeholder="**Key features**, details..."></textarea>
              </div>
              <button type="submit" class="w-full bg-[#0b3c3d] hover:bg-[#072a2b] dark:bg-teal-600 dark:hover:bg-teal-500 text-white font-medium py-2.5 px-4 rounded-xl text-sm transition-all shadow-sm">
                + Create Product
              </button>
              <p id="statusMsg" class="text-xs text-center hidden"></p>
            </form>
          </div>
        </aside>

        <!-- Product Grid Section -->
        <main class="lg:col-span-8">
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-lg font-bold text-slate-900 dark:text-white">Available Products</h2>
            <span class="text-xs text-slate-500 dark:text-slate-400 font-mono" id="itemCount">0 Items</span>
          </div>

          <div id="productList" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <!-- Dynamically Populated -->
          </div>
        </main>
      </div>
    </div>

    <script>
      // Theme State Handler
      const themeToggleBtn = document.getElementById('themeToggleBtn');
      const themeToggleIcon = document.getElementById('themeToggleIcon');

      function applyTheme(isDark) {
        if (isDark) {
          document.documentElement.classList.add('dark');
          themeToggleIcon.textContent = '☀️';
          localStorage.setItem('theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          themeToggleIcon.textContent = '🌙';
          localStorage.setItem('theme', 'light');
        }
      }

      // Read preference on page load
      const savedTheme = localStorage.getItem('theme');
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(savedTheme === 'dark' || (!savedTheme && systemPrefersDark));

      themeToggleBtn.addEventListener('click', () => {
        const isCurrentlyDark = document.documentElement.classList.contains('dark');
        applyTheme(!isCurrentlyDark);
      });

      // Product Logic
      const productList = document.getElementById("productList");
      const productForm = document.getElementById("productForm");
      const statusMsg = document.getElementById("statusMsg");
      const itemCount = document.getElementById("itemCount");
      const searchInput = document.getElementById("searchInput");

      let allProducts = [];

      async function fetchProducts() {
        try {
          const res = await fetch("/products");
          allProducts = await res.json();
          renderProducts(allProducts);
        } catch (err) {
          productList.innerHTML = '<p class="text-red-500 text-sm">Failed to load products.</p>';
        }
      }

      function renderProducts(items) {
        productList.innerHTML = "";
        itemCount.textContent = `${items.length} Items`;

        if (items.length === 0) {
          productList.innerHTML = `<p class="text-slate-400 dark:text-slate-500 text-sm col-span-2">No products found.</p>`;
          return;
        }

        items.forEach((item) => {
          const card = document.createElement("div");
          card.className = "bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm hover:shadow-md transition-all flex flex-col justify-between overflow-hidden group";
          
          const renderedMarkdown = marked.parse(item.description || "");

          card.innerHTML = `
            <div>
              <div class="w-full h-48 bg-slate-100 dark:bg-slate-900 overflow-hidden relative border-b border-slate-100 dark:border-slate-700/50">
                <img src="${item.image || 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600&q=80'}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                <span class="absolute top-3 left-3 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md px-2.5 py-1 rounded-full text-[10px] font-mono text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700">#${item.id}</span>
              </div>
              <div class="p-5">
                <h3 class="font-bold text-slate-900 dark:text-white text-base">${item.name}</h3>
                <div class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 mt-2 leading-relaxed">
                  ${renderedMarkdown}
                </div>
              </div>
            </div>
            
            <div class="px-5 pb-5 pt-2 flex justify-between items-center border-t border-slate-100 dark:border-slate-700/50">
              <span class="text-lg font-bold text-slate-900 dark:text-emerald-400">$${item.price}</span>
              <a href="/product.html?id=${item.id}" class="text-xs bg-slate-900 hover:bg-slate-800 dark:bg-teal-600 dark:hover:bg-teal-500 text-white font-medium px-3.5 py-2 rounded-xl transition-colors">
                View Item →
              </a>
            </div>
          `;
          productList.appendChild(card);
        });
      }

      // Live Search Filter
      searchInput.addEventListener("input", (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query) || p.description.toLowerCase().includes(query));
        renderProducts(filtered);
      });

      // Form Submit
      productForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("name").value;
        const image = document.getElementById("image").value;
        const price = document.getElementById("price").value;
        const description = document.getElementById("description").value;

        try {
          const res = await fetch("/products", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, image, price, description }),
          });

          if (res.ok) {
            statusMsg.textContent = "Product added successfully!";
            statusMsg.className = "text-xs text-center text-emerald-600 dark:text-emerald-400 block";
            productForm.reset();
            fetchProducts();
          } else {
            statusMsg.textContent = "Error adding product";
            statusMsg.className = "text-xs text-center text-red-500 block";
          }
        } catch (err) {
          statusMsg.textContent = "Network error";
          statusMsg.className = "text-xs text-center text-red-500 block";
        }
        setTimeout(() => (statusMsg.className = "text-xs text-center hidden"), 3000);
      });

      fetchProducts();
    </script>
  </body>
</html>
